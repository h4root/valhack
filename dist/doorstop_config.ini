[General]
# Включён ли Doorstop. Переопределяется переменной окружения DOORSTOP_ENABLED.
enabled=true

# Путь к управляемой сборке, которую Doorstop загрузит и вызовет
# (Doorstop.Entrypoint.Start). Путь относительно папки с valheim.exe.
target_assembly=Doorstop\ValheimAdminOverlay.Host.dll

# Перенаправлять ли вывод Unity в отдельный файл рядом с игрой.
redirect_output_log=false

# Если true, Doorstop игнорирует переменную DOORSTOP_ENABLED и грузится всегда.
ignore_disable_switch=false

[UnityMono]
# Переопределение пути поиска Mono-библиотек. Пусто = как у игры.
dll_search_path_override=

# Отладчик Mono. Для оверлея не нужен.
debug_enabled=false
debug_address=127.0.0.1:10000
debug_suspend=false
